<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Round Earth lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #e8ecf0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #panel { position: fixed; top: 12px; left: 12px; width: 250px; max-height: calc(100vh - 84px); overflow-y: auto; box-sizing: border-box;
    padding: 12px; background: rgba(12, 16, 22, .82); border-radius: 8px; }
  #panel h1 { font-size: 15px; margin: 0 0 2px; }
  #panel .ver { color: #8a96a3; font-size: 11px; margin-bottom: 10px; }
  #panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8a96a3; margin: 12px 0 4px; }
  #places button { display: block; width: 100%; text-align: left; margin: 2px 0; padding: 4px 8px; background: #1f2833; color: #e8ecf0;
    border: 1px solid #2e3a47; border-radius: 4px; font: inherit; cursor: pointer; }
  #places button:hover { background: #2a3644; }
  label { display: block; margin: 4px 0; }
  input[type=range] { width: 100%; }
  #keys { color: #b4bec8; font-size: 12px; }
  #keys b { color: #e8ecf0; font-weight: 600; }
  #status { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 12px; background: rgba(12, 16, 22, .82); font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  #error { display: none; position: fixed; inset: 30% 20% auto; padding: 16px; background: #5a1a1a; border-radius: 8px; white-space: pre-wrap; }
  #hide { position: absolute; top: 8px; right: 8px; background: none; border: 0; color: #8a96a3; cursor: pointer; font: inherit; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="panel">
  <button id="hide" title="Hide this panel (H)">hide</button>
  <h1>Round Earth lab</h1>
  <div class="ver" id="ver"></div>
  <h2>Go to</h2>
  <div id="places"></div>
  <h2>Height above the ground</h2>
  <input type="range" id="height" min="0" max="1000" step="1">
  <div id="heightText"></div>
  <h2>Detail</h2>
  <label>Split tiles when a grid square is wider than <span id="detailText"></span> pixels
    <input type="range" id="detail" min="1" max="16" step="0.5"></label>
  <label>Finest zoom <select id="maxZ"></select></label>
  <label><input type="checkbox" id="tint"> Colour tiles by zoom</label>
  <h2>Keys</h2>
  <div id="keys"><b>Drag</b> to look &nbsp; <b>W A S D</b> move<br><b>Space</b> up &nbsp; <b>C</b> down &nbsp; <b>Shift</b> faster<br>
    <b>Wheel</b> higher or lower &nbsp; <b>H</b> hide panel</div>
</div>
<div id="status"></div>
<div id="error"></div>
<script type="module" src="roundearth.js"></script>
</body>
</html>
